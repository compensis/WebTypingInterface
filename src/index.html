<!DOCTYPE html>
<html>
<head>
  <title>ESP32 USB HID Keyboard</title>
  <style>
    body { font-family: Arial; }
    textarea { width: 100%; font-size: 16px; }
    .slider-container { margin-top: 10px; }
    label { display: block; margin-top: 10px; }
  </style>

  <script>
    const socket = new WebSocket(`ws://${location.hostname}:81`);

    const KEY_SHIFT = 16;
    const KEY_CTRL  = 17;
    const KEY_ALT   = 18;
    const KEY_META  = 91;

    document.addEventListener("keydown", event => {
      if (socket.readyState === WebSocket.OPEN) {
        if (event.keyCode === KEY_SHIFT
          || event.keyCode === KEY_CTRL
          || event.keyCode === KEY_ALT
          || event.keyCode === KEY_META)
          return;

        const modifiers = [];

        if (event.ctrlKey) modifiers.push(KEY_CTRL);
        if (event.shiftKey) modifiers.push(KEY_SHIFT);
        if (event.altKey) modifiers.push(KEY_ALT);
        if (event.metaKey) modifiers.push(KEY_META);

        const packet = new Uint8Array([...modifiers, event.keyCode]);

        if (socket.readyState === WebSocket.OPEN)
            socket.send(packet);
      }
    });
  </script>
</head>

<body>
  <h2>ESP32 USB HID Keyboard</h2>

  <textarea id="inputText" rows="10"
    placeholder="Enter = send | Shift+Enter = newline"></textarea>

</body>
</html>
